<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Results — PlagiGuard</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/plagiguard.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

<script src="../js/app.js"></script>
<script src="../js/ui.js"></script>

<script>
(async function () {
    'use strict';

    const student = PG.requireRole('student');
    if (!student) return;

    let submissions = [];
    let settings = PG.getSettings();
    let activeFilter = 'all';
    let searchText = '';

    function esc(value) {
        return PG.escapeHtml(String(value ?? ''));
    }

    function getAssignment(s) {
        if (s.assignment && typeof s.assignment === 'object') {
            return {
                id: s.assignment._id || s.assignment.id,
                title: s.assignment.title || 'Untitled assignment',
                course: s.assignment.course || 'Course',
                maxMarks: s.assignment.maxMarks ?? 100
            };
        }

        return PG.getAssignments().find(a =>
            String(a.id) === String(s.assignmentId || s.assignment || '')
        ) || {
            title: 'Assignment',
            course: 'Course',
            maxMarks: 100
        };
    }

    function normalize(s) {
        return {
            ...s,
            id: String(s._id || s.id || ''),
            assignmentId: String(
                s.assignment?._id || s.assignment?.id || s.assignmentId || ''
            ),
            assignment: getAssignment(s),
            filename: s.filename || 'Submitted file',
            wordCount: Number(s.wordCount) || 0,
            maxSimilarity: Number(
                s.maxSimilarity ?? s.topMatch?.similarity ?? 0
            ),
            flagged: Boolean(s.flagged),
            matchingNgrams: s.matchingNGrams || s.matchingNgrams || [],
            topMatchStudent:
                s.topMatch?.student?.name || s.topMatchStudent || null,
            marks: s.marks ?? null,
            feedback: s.feedback || '',
            status: s.status || 'submitted',
            submittedAt: s.submittedAt || null
        };
    }

    function getStatus(s) {
        if (s.flagged) {
            return {
                label: 'Flagged for review',
                filter: 'flagged',
                cls: 'flagged'
            };
        }

        if (s.topMatchStudent) {
            return {
                label: 'Compared',
                filter: 'clear',
                cls: 'clear'
            };
        }

        return {
            label: 'Awaiting comparison',
            filter: 'pending',
            cls: 'pending'
        };
    }

    function dateFormat(value) {
        if (!value) return 'Not available';

        const date = new Date(value);
        return Number.isNaN(date.getTime())
            ? 'Not available'
            : date.toLocaleString();
    }

    function scoreClass(score) {
        const threshold = Number(settings.similarityThreshold) || 30;

        if (score >= threshold) return 'danger';
        if (score >= threshold / 2) return 'watch';
        return 'safe';
    }

    function renderCard(s) {
        const a = s.assignment;
        const status = getStatus(s);
        const score = Math.max(0, Math.min(100, s.maxSimilarity));
        const tone = scoreClass(score);

        const marks = s.marks == null
            ? 'Pending'
            : `${esc(s.marks)}/${esc(a.maxMarks)}`;

        return `
            <article class="professional-report-card"
                data-report-status="${status.filter}"
                data-report-search="${esc(
                    `${a.title} ${a.course} ${s.filename}`.toLowerCase()
                )}">

                <div class="professional-report-accent ${tone}"></div>

                <div class="professional-report-main">
                    <div class="professional-report-title">
                        <div>
                            <span class="eyebrow">${esc(a.course)}</span>
                            <h3>${esc(a.title)}</h3>
                            <p>
                                ${s.wordCount} words ·
                                Submitted ${esc(dateFormat(s.submittedAt))}
                            </p>
                        </div>

                        <span class="report-status ${status.cls}">
                            ${status.label}
                        </span>
                    </div>

                    <div class="professional-report-metrics">
                        <div>
                            <span>Similarity</span>
                            <strong class="score-${tone}">
                                ${score.toFixed(1)}%
                            </strong>
                            <div class="report-meter-track compact">
                                <span class="${tone}"
                                    style="width:${score}%"></span>
                            </div>
                        </div>

                        <div>
                            <span>Highest match</span>
                            <strong>${esc(s.topMatchStudent || '—')}</strong>
                            <small>${s.matchingNgrams.length} shared phrases</small>
                        </div>

                        <div>
                            <span>Marks</span>
                            <strong>${marks}</strong>
                            <small>${esc(s.feedback || 'Feedback pending')}</small>
                        </div>
                    </div>
                </div>

                <div class="professional-report-actions">
                    <button type="button"
                        class="btn btn-primary report-open-btn"
                        data-id="${esc(s.id)}">
                        View full report
                    </button>
                    <span class="report-file">${esc(s.filename)}</span>
                </div>
            </article>
        `;
    }

    function renderReport(s) {
        const a = s.assignment;
        const status = getStatus(s);
        const tone = scoreClass(s.maxSimilarity);

        const modal = document.createElement('div');
        modal.className = 'report-modal-backdrop';

        modal.innerHTML = `
            <div class="report-modal" role="dialog" aria-modal="true">
                <div class="report-modal-topbar">
                    <div class="report-brand">
                        <span class="brand-icon">🛡️</span>
                        <div>
                            <strong>PlagiGuard Similarity Report</strong>
                            <small>PG-${esc(s.id.slice(-8).toUpperCase())}</small>
                        </div>
                    </div>
                    <button class="report-close" type="button"
                        aria-label="Close report">×</button>
                </div>

                <div class="report-modal-body">
                    <section class="report-cover">
                        <div class="report-cover-main">
                            <span class="eyebrow">SIMILARITY REPORT</span>
                            <h2>${esc(a.title)}</h2>
                            <p>
                                ${esc(a.course)} · ${esc(student.name)} ·
                                ${esc(dateFormat(s.submittedAt))}
                            </p>
                        </div>
                        <div class="report-score-ring ${tone}"
                            style="--report-score:${s.maxSimilarity * 3.6}deg">
                            <div>
                                <strong>${s.maxSimilarity.toFixed(1)}%</strong>
                                <span>similarity</span>
                            </div>
                        </div>
                    </section>

                    <section class="report-alert ${
                        s.flagged ? 'alert-danger' :
                        s.topMatchStudent ? 'alert-safe' : 'alert-pending'
                    }">
                        <div>
                            <strong>${status.label}</strong>
                            <p>
                                Similarity is an indicator of text overlap,
                                not a final plagiarism decision.
                            </p>
                        </div>
                    </section>

                    <div class="report-stat-grid">
                        <div class="report-stat">
                            <span>Word count</span>
                            <strong>${s.wordCount}</strong>
                        </div>
                        <div class="report-stat">
                            <span>Marks</span>
                            <strong>${s.marks == null ? 'Pending' : esc(s.marks)}</strong>
                        </div>
                        <div class="report-stat">
                            <span>Matching phrases</span>
                            <strong>${s.matchingNgrams.length}</strong>
                        </div>
                        <div class="report-stat">
                            <span>Highest match</span>
                            <strong>${esc(s.topMatchStudent || '—')}</strong>
                        </div>
                    </div>

                    <section class="report-section">
                        <h3>Submission details</h3>
                        <p><strong>File:</strong> ${esc(s.filename)}</p>
                        <p><strong>Submitted:</strong> ${esc(dateFormat(s.submittedAt))}</p>
                        <p><strong>Status:</strong> ${esc(s.status)}</p>
                        <p><strong>Feedback:</strong> ${esc(s.feedback || 'No feedback yet')}</p>
                    </section>

                    <section class="report-section">
                        <h3>Matching phrases</h3>
                        ${
                            s.matchingNgrams.length
                                ? '<ul>' + s.matchingNgrams.slice(0, 30)
                                    .map(x => `<li>${esc(x)}</li>`).join('') +
                                  '</ul>'
                                : '<p>No matching phrases were returned.</p>'
                        }
                    </section>

                    <button class="btn btn-secondary print-report"
                        type="button">Save / Print PDF</button>
                </div>
            </div>
        `;

        document.body.appendChild(modal);
        document.body.classList.add('report-modal-open');

        function close() {
            modal.remove();
            document.body.classList.remove('report-modal-open');
        }

        modal.querySelector('.report-close').addEventListener('click', close);

        modal.addEventListener('click', e => {
            if (e.target === modal) close();
        });

        modal.querySelector('.print-report').addEventListener('click', () => {
            window.print();
        });
    }

    function bindEvents() {
        document.querySelectorAll('.report-open-btn').forEach(button => {
            button.addEventListener('click', () => {
                const s = submissions.find(x => x.id === button.dataset.id);
                if (s) renderReport(s);
            });
        });

        document.querySelectorAll('[data-report-filter]').forEach(button => {
            button.addEventListener('click', () => {
                activeFilter = button.dataset.reportFilter;

                document.querySelectorAll('[data-report-filter]')
                    .forEach(b => b.classList.toggle('active', b === button));

                applyFilters();
            });
        });

        const search = document.getElementById('student-report-search');

        if (search) {
            search.addEventListener('input', () => {
                searchText = search.value.toLowerCase().trim();
                applyFilters();
            });
        }
    }

    function applyFilters() {
        document.querySelectorAll('.professional-report-card').forEach(card => {
            const statusMatch =
                activeFilter === 'all' ||
                card.dataset.reportStatus === activeFilter;

            const searchMatch =
                (card.dataset.reportSearch || '').includes(searchText);

            card.hidden = !(statusMatch && searchMatch);
        });
    }

    function renderResults() {
        const compared = submissions.filter(s => s.topMatchStudent);

        const average = compared.length
            ? compared.reduce((total, s) => total + s.maxSimilarity, 0)
                / compared.length
            : null;

        const flagged = submissions.filter(s => s.flagged).length;

        const highest = submissions.length
            ? submissions.reduce((best, s) =>
                s.maxSimilarity > best.maxSimilarity ? s : best)
            : null;

        const content = `
            <div class="report-command-bar">
                <div>
                    <span class="eyebrow">REPORT CENTER</span>
                    <strong>${submissions.length} report${submissions.length === 1 ? '' : 's'} available</strong>
                    <span class="text-muted">
                        Your submission reports and feedback.
                    </span>
                </div>
                <div class="report-command-meta">
                    <span class="mini-method">${settings.ngramSize}-gram</span>
                    <span class="mini-method">${settings.similarityThreshold}% threshold</span>
                    <a class="btn btn-secondary btn-sm" href="upload.html">
                        + New submission
                    </a>
                </div>
            </div>

            <section class="report-stat-grid report-stat-grid-top">
                <div class="report-stat report-stat-primary">
                    <span>Average similarity</span>
                    <strong>${average == null ? '—' : average.toFixed(1) + '%'}</strong>
                    <small>Among compared submissions</small>
                </div>

                <div class="report-stat">
                    <span>Flagged for review</span>
                    <strong>${flagged}</strong>
                    <small>Requires instructor review if applicable</small>
                </div>

                <div class="report-stat">
                    <span>Highest similarity</span>
                    <strong>${highest ? highest.maxSimilarity.toFixed(1) + '%' : '—'}</strong>
                    <small>${highest ? esc(highest.assignment.title) : 'No reports yet'}</small>
                </div>

                <div class="report-stat">
                    <span>Marked</span>
                    <strong>${submissions.filter(s => s.marks != null).length}/${submissions.length}</strong>
                    <small>Assignments graded</small>
                </div>
            </section>

            <section class="section-card report-inbox-card">
                <div class="report-inbox-head">
                    <div>
                        <span class="eyebrow">YOUR REPORTS</span>
                        <h2 class="section-title">Submission history</h2>
                        <p class="text-muted">
                            Open a report for its similarity details and feedback.
                        </p>
                    </div>

                    <div class="report-tools">
                        <input id="student-report-search"
                            class="form-input search-input"
                            type="search"
                            placeholder="Search reports..."
                            aria-label="Search reports">

                        <div class="report-filter-tabs">
                            <button class="active" data-report-filter="all">All</button>
                            <button data-report-filter="flagged">Flagged</button>
                            <button data-report-filter="clear">Compared</button>
                            <button data-report-filter="pending">Pending</button>
                        </div>
                    </div>
                </div>

                <div id="student-report-list" class="student-report-list">
                    ${
                        submissions.length
                            ? submissions.map(renderCard).join('')
                            : `
                                <div class="result-empty">
                                    <h3>No reports available</h3>
                                    <p>Your submissions will appear here.</p>
                                    <a class="btn btn-primary" href="upload.html">
                                        Submit work
                                    </a>
                                </div>
                            `
                    }
                </div>
            </section>
        `;

        pgLayout({
            active: 'results',
            role: 'student',
            title: 'Similarity Reports',
            subtitle: 'Review your submission status, similarity evidence, marking and feedback in one place.',
            content
        });

        bindEvents();
    }

    async function loadResults() {
        try {
            settings = PG.getSettings();

            // app.js manages the authentication token.
            const result = await PG.fetchMySubmissions();

            const list = Array.isArray(result)
                ? result
                : result?.submissions || result?.data || [];

            submissions = list.map(normalize);
            submissions.sort((a, b) =>
                new Date(b.submittedAt || 0) - new Date(a.submittedAt || 0)
            );

            renderResults();

        } catch (error) {
            console.error('Failed to load student results:', error);

            pgLayout({
                active: 'results',
                role: 'student',
                title: 'Similarity Reports',
                subtitle: 'Review your submission status, similarity evidence, marking and feedback in one place.',
                content: `
                    <div class="result-empty">
                        <h3>Could not load reports</h3>
                        <p>${esc(error.message || 'Please sign in again.')}</p>
                        <button class="btn btn-primary" id="retry-results" type="button">
                            Try again
                        </button>
                    </div>
                `
            });

            document.getElementById('retry-results')
                ?.addEventListener('click', loadResults);
        }
    }

    await loadResults();

})();
</script>

</body>
</html>
