<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Sign Up — PlagiGuard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/phase1.css">
</head>

<body>
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div style="font-size:2.5rem">🛡️</div>
                <h1>Create your account</h1>
                <p class="text-muted">Choose the role that controls your dashboard</p>
            </div>
            <form id="signup-form">
                <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="name"
                        required placeholder="Your full name"></div>
                <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email"
                        id="email" required placeholder="you@university.edu"></div>
                <div class="form-group"><label class="form-label">Role</label><select class="form-input" id="role">
                        <option value="student">Student</option>
                        <option value="instructor">Instructor</option>
                    </select></div>
                <div class="form-group" id="student-id-group"><label class="form-label">Student ID</label><input
                        class="form-input" id="student-id" placeholder="STU001"></div>
                <div class="form-group"><label class="form-label">Password</label>
                    <div style="position:relative"><input class="form-input" type="password" id="password" minlength="6"
                            required placeholder="At least 6 characters"><button type="button" class="toggle-password"
                            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer">Show</button>
                    </div>
                </div>
                <div class="auth-error" id="auth-error"></div><button class="btn btn-primary" type="submit"
                    style="width:100%">Create Account & Open Dashboard</button>
            </form>
            <p class="text-muted" style="text-align:center;margin-top:1.5rem">Already registered? <a
                    href="login.html">Login</a></p>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/pages/signup.js"></script>
</body>

</html>
