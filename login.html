<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login — PlagiGuard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/phase1.css">
</head>

<body>
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <div style="font-size:2.5rem">🛡️</div>
                <h1>Welcome back</h1>
                <p class="text-muted">Login as Student or Instructor</p>
            </div>
            <form id="login-form">
                <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email"
                        id="email" required placeholder="you@university.edu"></div>
                <div class="form-group"><label class="form-label">Password</label>
                    <div style="position:relative"><input class="form-input" type="password" id="password" required
                            placeholder="••••••••"><button type="button" class="toggle-password"
                            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer">Show</button>
                    </div>
                </div>
                <div class="auth-error" id="auth-error"></div><button class="btn btn-primary" type="submit"
                    style="width:100%">Login</button>
            </form>
            <div class="demo-hint"><strong>Demo accounts</strong><br>Instructor: instructor@university.edu /
                password123<br>Student: aarav@student.edu / password123</div>
            <p class="text-muted" style="text-align:center;margin-top:1.5rem">New here? <a href="signup.html">Create an
                    account</a></p>
        </div>
    </main>
    <script src="js/app.js"></script>
    <script src="js/pages/login.js"></script>
</body>

</html>
